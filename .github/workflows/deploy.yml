name: CI/CD Pipeline - Deploy to EC2

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '20'
  APP_NAME: 'mediconnect-backend'

jobs:
  # Job 1: Build and Test
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 1
          
      - name: Upload package files
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: package-files-${{ github.sha }}
          path: |
            package.json
            package-lock.json
          retention-days: 1

  # Job 2: Deploy to EC2 (only on main/develop push)
  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          
      - name: Download package files
        uses: actions/download-artifact@v4
        with:
          name: package-files-${{ github.sha }}
          
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          
          # Create deployment package
          tar -czf deployment.tar.gz dist/ package.json package-lock.json
          
          # Transfer to EC2
          scp -i ~/.ssh/deploy_key deployment.tar.gz $EC2_USER@$EC2_HOST:/tmp/
          
          # Execute deployment script on EC2
          ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST << 'EOF'
          set -e
          
          APP_DIR="/home/ec2-user/apps/mediconnect-backend"
          
          echo "=== Starting deployment ==="
          
          # Create app directory if it doesn't exist
          mkdir -p $APP_DIR
          
          # Extract and deploy new version
          cd $APP_DIR
          tar -xzf /tmp/deployment.tar.gz
          
          # Install dependencies
          npm ci --only=production
          
          # Kill any existing process and start fresh
          pkill -f "node dist/main.js" || true
          sleep 2
          
          # Start the server
          node dist/main.js > /tmp/app.log 2>&1 &
          
          # Clean up
          rm /tmp/deployment.tar.gz
          
          echo "=== Deployment completed successfully ==="
          echo "Server started. PID: $!"
          EOF
          
      - name: Deployment Status
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
            exit 1
          fi
